[build-system]
requires = ["setuptools>=63.0.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["services", "routers", "database"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "SIM"]
ignore = ["S101", "E501", "E701", "N806", "E722", "S110", "S603", "S607", "F841", "F541", "B007"]

[tool.ruff.format]
quote-style = "double"

[tool.checklist]
mark-completed = true
