<!DOCTYPE html>
<html lang="es" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - X-Ray AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class', } </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body
    class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300 relative">

    <div class="absolute top-4 right-4 flex items-center gap-3">
        <button onclick="toggleTheme()"
            class="text-gray-500 dark:text-gray-400 hover:text-blue-500 w-8 h-8 flex items-center justify-center rounded-lg transition-colors">
            <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
        </button>
        <div
            class="flex items-center gap-2 bg-white dark:bg-gray-800 px-3 py-2 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
            <i class="fa-solid fa-globe text-blue-500 dark:text-blue-400"></i>
            <select id="lang-selector" onchange="changeLanguage()"
                class="bg-transparent border-none text-sm font-bold text-gray-600 dark:text-gray-200 focus:outline-none cursor-pointer pr-2 appearance-none">
                <option value="es" class="dark:bg-gray-800">Español</option>
                <option value="en" class="dark:bg-gray-800">English</option>
                <option value="zh" class="dark:bg-gray-800">中文 (Mandarin)</option>
                <option value="hi" class="dark:bg-gray-800">हिन्दी (Hindi)</option>
            </select>
        </div>
    </div>

    <div
        class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-sm border border-gray-100 dark:border-gray-700 mt-10">
        <div class="flex flex-col items-center mb-8">
            <div
                class="bg-blue-600 dark:bg-blue-500 text-white w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg mb-4">
                <i class="fa-solid fa-lungs-virus text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-800 dark:text-white" id="ui-title">Iniciar Sesión</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">X-Ray AI Consultant</p>
        </div>

        <form id="login-form" action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wide mb-1"
                    id="ui-user">Usuario</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" name="username" required
                        class="w-full bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white border border-gray-200 dark:border-gray-600 rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wide mb-1"
                    id="ui-pass">Contraseña</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="password" name="password" required
                        class="w-full bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white border border-gray-200 dark:border-gray-600 rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <div id="error-msg"
                class="hidden rounded-lg p-3 text-sm font-semibold text-center bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i> <span id="ui-error-text">Credenciales
                    incorrectas.</span>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 text-white font-bold py-3.5 rounded-lg shadow-md transition-all flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> <span id="ui-btn-text">Entrar al Sistema</span>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-gray-100 dark:border-gray-700 pt-6">
            <p class="text-sm text-gray-500 dark:text-gray-400"><span id="ui-footer-text">¿No tienes cuenta?</span>
                <a href="/register" class="text-blue-600 dark:text-blue-400 font-bold hover:underline"
                    id="ui-footer-link">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script>
        const dict = {
            es: { title: "Iniciar Sesión", user: "Usuario", pass: "Contraseña", btn: "Entrar al Sistema", footerTxt: "¿No tienes cuenta?", footerLink: "Regístrate aquí", err: "Credenciales incorrectas." },
            en: { title: "Log In", user: "Username", pass: "Password", btn: "Sign In", footerTxt: "Don't have an account?", footerLink: "Sign up here", err: "Invalid credentials." },
            zh: { title: "登录", user: "用户名", pass: "密码", btn: "进入系统", footerTxt: "还没有账户？", footerLink: "在此注册", err: "凭据无效。" },
            hi: { title: "लॉग इन करें", user: "उपयोगकर्ता नाम", pass: "पासवर्ड", btn: "सिस्टम में प्रवेश करें", footerTxt: "क्या आपके पास खाता नहीं है?", footerLink: "यहाँ रजिस्टर करें", err: "अमान्य क्रेडेंशियल।" }
        };
        let currentLang = 'es';

        function changeLanguage() {
            currentLang = document.getElementById('lang-selector').value;
            localStorage.setItem('appLang', currentLang);
            const t = dict[currentLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-user').innerText = t.user;
            document.getElementById('ui-pass').innerText = t.pass;
            document.getElementById('ui-btn-text').innerText = t.btn;
            document.getElementById('ui-footer-text').innerText = t.footerTxt;
            document.getElementById('ui-footer-link').innerText = t.footerLink;
            document.getElementById('ui-error-text').innerText = t.err;
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-moon text-lg';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun text-lg';
                localStorage.setItem('theme', 'dark');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('theme-icon');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                icon.className = 'fa-solid fa-sun text-lg';
            }
            const savedLang = localStorage.getItem('appLang');
            if (savedLang) {
                document.getElementById('lang-selector').value = savedLang;
                currentLang = savedLang;
            }
            changeLanguage();
            if (new URLSearchParams(window.location.search).has('error')) {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
