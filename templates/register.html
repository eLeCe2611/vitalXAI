<!DOCTYPE html>
<html lang="es" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - X-Ray AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class', } </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body
    class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300 relative">

    <div class="absolute top-4 right-4 flex items-center gap-3">
        <button onclick="toggleTheme()"
            class="text-gray-500 dark:text-gray-400 hover:text-blue-500 w-8 h-8 flex items-center justify-center rounded-lg transition-colors">
            <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
        </button>
        <div
            class="flex items-center gap-2 bg-white dark:bg-gray-800 px-3 py-2 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
            <i class="fa-solid fa-globe text-blue-500 dark:text-blue-400"></i>
            <select id="lang-selector" onchange="changeLanguage()"
                class="bg-transparent border-none text-sm font-bold text-gray-600 dark:text-gray-200 focus:outline-none cursor-pointer pr-2 appearance-none">
                <option value="es" class="dark:bg-gray-800">Español</option>
                <option value="en" class="dark:bg-gray-800">English</option>
                <option value="zh" class="dark:bg-gray-800">中文 (Mandarin)</option>
                <option value="hi" class="dark:bg-gray-800">हिन्दी (Hindi)</option>
            </select>
        </div>
    </div>

    <div
        class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-700 mt-10">
        <div class="flex flex-col items-center mb-8">
            <div
                class="bg-blue-600 dark:bg-blue-500 text-white w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg mb-4">
                <i class="fa-solid fa-user-doctor text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-800 dark:text-white" id="ui-title">Crear Cuenta</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">X-Ray AI Consultant</p>
        </div>

        <form id="register-form" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wide mb-1"
                        id="ui-fname">Nombre</label>
                    <input type="text" id="first_name" required
                        class="w-full bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white border border-gray-200 dark:border-gray-600 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wide mb-1"
                        id="ui-lname">Apellido</label>
                    <input type="text" id="last_name" required
                        class="w-full bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white border border-gray-200 dark:border-gray-600 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wide mb-1"
                    id="ui-role">Especialidad (Rol)</label>
                <select id="role"
                    class="w-full bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white border border-gray-200 dark:border-gray-600 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Médico Residente" id="opt-resident">Médico Residente</option>
                    <option value="Radiólogo Especialista" id="opt-radiologist">Radiólogo Especialista</option>
                    <option value="Médico de Familia" id="opt-family">Médico de Familia</option>
                    <option value="Neumólogo" id="opt-neumo">Neumólogo</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wide mb-1"
                    id="ui-user">Usuario</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="username" required
                        class="w-full bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white border border-gray-200 dark:border-gray-600 rounded-lg pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wide mb-1"
                    id="ui-pass">Contraseña</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="password" required
                        class="w-full bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white border border-gray-200 dark:border-gray-600 rounded-lg pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div id="alert-box" class="hidden"></div>

            <button type="submit" id="submit-btn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition-all flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-user-plus"></i> <span id="ui-btn-text">Registrarme</span>
            </button>
        </form>

        <div class="mt-6 text-center border-t border-gray-100 dark:border-gray-700 pt-6">
            <p class="text-sm text-gray-500 dark:text-gray-400"><span id="ui-footer-text">¿Ya tienes una cuenta?</span>
                <a href="/" class="text-blue-600 dark:text-blue-400 font-bold hover:underline"
                    id="ui-footer-link">Inicia Sesión</a>
            </p>
        </div>
    </div>

    <script>
        const dict = {
            es: { title: "Crear Cuenta", fname: "Nombre", lname: "Apellido", role: "Especialidad (Rol)", user: "Usuario", pass: "Contraseña", btn: "Registrarme", footerTxt: "¿Ya tienes una cuenta?", footerLink: "Inicia Sesión", opt1: "Médico Residente", opt2: "Radiólogo Especialista", opt3: "Médico de Familia", opt4: "Neumólogo", msgProcessing: "Procesando...", err_user_exists: "Usuario en uso.", err_server_error: "Error del servidor.", msg_success: "Éxito. Redirigiendo..." },
            en: { title: "Create Account", fname: "First Name", lname: "Last Name", role: "Specialty (Role)", user: "Username", pass: "Password", btn: "Sign Up", footerTxt: "Already have an account?", footerLink: "Log In", opt1: "Medical Resident", opt2: "Specialist Radiologist", opt3: "Family Doctor", opt4: "Pulmonologist", msgProcessing: "Processing...", err_user_exists: "Username taken.", err_server_error: "Server error.", msg_success: "Success. Redirecting..." },
            zh: { title: "创建账户", fname: "名字", lname: "姓氏", role: "专业 (角色)", user: "用户名", pass: "密码", btn: "注册", footerTxt: "已有账户？", footerLink: "登录", opt1: "住院医师", opt2: "放射科专家", opt3: "家庭医生", opt4: "呼吸科医生", msgProcessing: "处理中...", err_user_exists: "该用户名已被使用。", err_server_error: "服务器错误。", msg_success: "成功。重定向中..." },
            hi: { title: "खाता बनाएं", fname: "पहला नाम", lname: "उपनाम", role: "विशेषज्ञता", user: "उपयोगकर्ता नाम", pass: "पासवर्ड", btn: "साइन अप करें", footerTxt: "क्या आपके पास खाता है?", footerLink: "लॉग इन करें", opt1: "रेजिडेंट", opt2: "रेडियोलॉजिस्ट", opt3: "पारिवारिक", opt4: "पल्मोनोलॉजिस्ट", msgProcessing: "प्रसंस्करण...", err_user_exists: "नाम पहले से है।", err_server_error: "सर्वर त्रुटि।", msg_success: "सफलता। पुनर्निर्देशित..." }
        };
        let currentLang = 'es';

        function changeLanguage() {
            currentLang = document.getElementById('lang-selector').value;
            localStorage.setItem('appLang', currentLang);
            const t = dict[currentLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-fname').innerText = t.fname;
            document.getElementById('ui-lname').innerText = t.lname;
            document.getElementById('ui-role').innerText = t.role;
            document.getElementById('ui-user').innerText = t.user;
            document.getElementById('ui-pass').innerText = t.pass;
            document.getElementById('ui-btn-text').innerText = t.btn;
            document.getElementById('ui-footer-text').innerText = t.footerTxt;
            document.getElementById('ui-footer-link').innerText = t.footerLink;
            document.getElementById('opt-resident').innerText = t.opt1;
            document.getElementById('opt-radiologist').innerText = t.opt2;
            document.getElementById('opt-family').innerText = t.opt3;
            document.getElementById('opt-neumo').innerText = t.opt4;
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-moon text-lg';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun text-lg';
                localStorage.setItem('theme', 'dark');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('theme-icon');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                icon.className = 'fa-solid fa-sun text-lg';
            }
            const savedLang = localStorage.getItem('appLang');
            if (savedLang) {
                document.getElementById('lang-selector').value = savedLang;
                currentLang = savedLang;
            }
            changeLanguage();
        });

        document.getElementById('register-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const alertBox = document.getElementById('alert-box');
            const t = dict[currentLang];

            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> <span>${t.msgProcessing}</span>`;
            btn.disabled = true;
            btn.classList.add('opacity-75');
            alertBox.className = 'hidden';

            const formData = new FormData();
            formData.append('first_name', document.getElementById('first_name').value);
            formData.append('last_name', document.getElementById('last_name').value);
            formData.append('role', document.getElementById('role').value);
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const response = await fetch('/api/register', { method: 'POST', body: formData });
                let result;
                try { result = await response.json(); } catch (e) { throw new Error(t.err_server_error); }

                if (response.ok && result.status === 'success') {
                    alertBox.innerHTML = `<i class="fa-solid fa-check-circle mr-1"></i> ${t.msg_success}`;
                    alertBox.className = 'rounded-lg p-3 text-sm font-semibold text-center bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 block mt-2';
                    setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
                } else {
                    throw new Error(t[`err_${result.code}`] || t.err_server_error);
                }
            } catch (error) {
                alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> ${error.message}`;
                alertBox.className = 'rounded-lg p-3 text-sm font-semibold text-center bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 block mt-2';
                btn.innerHTML = `<i class="fa-solid fa-user-plus"></i> <span id="ui-btn-text">${t.btn}</span>`;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        });
    </script>
</body>

</html>
